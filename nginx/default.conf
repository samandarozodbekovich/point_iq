# HTTP → HTTPS redirect
server {
    listen 80;
    server_name 45.138.159.84;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name 45.138.159.84;

    ssl_certificate /etc/ssl/getplace/self.crt;
    ssl_certificate_key /etc/ssl/getplace/self.key;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

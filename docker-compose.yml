networks:
  get_place_network:
    driver: bridge

services:
  db:
    image: postgres:16
    container_name: get_place_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - get_place_network
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: get_place_redis
    restart: always
    networks:
      - get_place_network
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: get_place_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn get_place.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/home/app/static
      - media_volume:/home/app/media
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery:
    build: .
    container_name: get_place_celery
    command: celery -A get_place worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: get_place_celery_beat
    command: celery -A get_place beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: get_place_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/home/app/static
      - media_volume:/home/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - get_place_network
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:

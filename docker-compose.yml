version: '3.8'

networks:
  get_place_network:
    driver: bridge

services:
  db:
    image: postgis/postgis:16-3.4  # PostGIS qo'shilgan versiya
    container_name: get_place_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - get_place_network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine # redis:8 hali beta bo'lishi mumkin, 7 barqaror
    container_name: get_place_redis
    restart: always
    networks:
      - get_place_network

  api:
    build: .
    ports:
      # Only the reverse proxy on this host may reach gunicorn. Exposed
      # publicly, clients could bypass the proxy and fake X-Forwarded-For.
      - "127.0.0.1:8000:8000"
    container_name: get_place_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn get_place.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    # NPY_DISABLE_CPU_FEATURES olib tashlandi, chunki NumPy optimallashdi
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: get_place_celery
    command: celery -A get_place worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: get_place_celery_beat
    command: celery -A get_place beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
       - db
       - redis

volumes:
  postgres_data:



networks:
  get_place_network:
    external: true

services:
  db:
    image: postgres:16
    container_name: get_place_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - get_place_network
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: get_place_redis
    restart: always
    networks:
      - get_place_network
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: get_place_web
    command: gunicorn get_place.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery:
    build: .
    container_name: get_place_celery
    command: celery -A get_place worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: get_place_celery_beat
    command: celery -A get_place beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - get_place_network
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yandex Xarita — Transport, Ob-havo va Masofa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6fa;
        }
        #map {
            width: 100%;
            height: 600px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #fff;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        input {
            padding: 8px;
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 8px 15px;
            border: none;
            background-color: #0078ff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fd9;
        }
        label {
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="controls">
    <input id="address" type="text" placeholder="Manzilni kiriting (masalan: Lutfiy ko‘chasi)">
    <button onclick="searchAddress()">Izlash</button>
    <label><input type="checkbox" id="traffic-toggle" checked> Tirbandlik</label>
    <label><input type="checkbox" id="weather-toggle"> Ob-havo</label>
    <label><input type="checkbox" id="measure-toggle"> Masofa o‘lchash</label>
</div>

<div id="map"></div>

<script>
let myMap, trafficLayer, weatherLayer, startPoint = null, line = null;

// Yandex xarita sozlamalari backenddan olinadi
async function getMapConfig() {
    const resp = await fetch("/map/api/map-config/");
    return await resp.json();
}

// Asosiy funksiya — xaritani ishga tushiradi
async function init() {
    const config = await getMapConfig();

    const script = document.createElement("script");
    script.src = `https://api-maps.yandex.ru/2.1/?apikey=${config.apikey}&lang=uz_UZ`;
    document.body.appendChild(script);

    script.onload = function() {
        ymaps.ready(() => {
            myMap = new ymaps.Map("map", {
                center: config.center,
                zoom: config.zoom,
                controls: ['zoomControl', 'geolocationControl']
            });

            // Tirbandlik boshqaruvi
            const trafficControl = new ymaps.control.TrafficControl({ state: { shown: true } });
            myMap.controls.add(trafficControl);

            // Ob-havo qatlam toggle
            document.getElementById("weather-toggle").addEventListener("change", toggleWeather);

            // Tirbandlik toggle
            document.getElementById("traffic-toggle").addEventListener("change", e => {
                trafficControl.state.set('shown', e.target.checked);
            });

            // Masofa o‘lchovchi toggle
            document.getElementById("measure-toggle").addEventListener("change", toggleMeasure);
        });
    };
}

// Ob-havo qatlamini qo‘shish
function toggleWeather() {
    const checked = document.getElementById("weather-toggle").checked;
    const openWeatherKey = "***REMOVED***"; // demo key
    if (checked) {
        weatherLayer = new ymaps.Layer(
            `https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${openWeatherKey}`,
            {
                tileTransparent: true,
                projection: ymaps.projection.sphericalMercator,
                crossOrigin: "anonymous"
            }
        );
        myMap.layers.add(weatherLayer);
    } else if (weatherLayer) {
        myMap.layers.remove(weatherLayer);
    }
}

// Masofa o‘lchash funksiyasi
function toggleMeasure() {
    const checked = document.getElementById("measure-toggle").checked;
    if (checked) {
        startPoint = null;
        myMap.events.add('click', onMapClick);
        alert("Masofa o‘lchash rejimi: 2 ta joyni bosing.");
    } else {
        myMap.events.remove('click', onMapClick);
        if (line) {
            myMap.geoObjects.remove(line);
            line = null;
        }
    }
}

function onMapClick(e) {
    const coords = e.get('coords');

    if (!startPoint) {
        startPoint = coords;
        const mark = new ymaps.Placemark(coords, { balloonContent: "Boshlang‘ich nuqta" }, { preset: 'islands#greenDotIcon' });
        myMap.geoObjects.add(mark);
    } else {
        const distance = ymaps.coordSystem.geo.getDistance(startPoint, coords);
        const km = (distance / 1000).toFixed(2);

        if (line) myMap.geoObjects.remove(line);
        line = new ymaps.Polyline([startPoint, coords], {
            balloonContent: `Masofa: ${km} km`
        }, {
            strokeColor: "#0078ff",
            strokeWidth: 4
        });
        myMap.geoObjects.add(line);
        myMap.balloon.open(coords, `Masofa: <b>${km} km</b>`);
        startPoint = null;
    }
}

// Manzil qidirish
async function searchAddress() {
    const query = document.getElementById("address").value.trim();
    if (!query) return alert("Manzil kiriting!");

    const resp = await fetch(`/map/api/geocode/?q=${encodeURIComponent(query)}`);
    if (!resp.ok) return alert("Xatolik: manzil topilmadi.");
    const data = await resp.json();

    const coords = data.coords;
    const placemark = new ymaps.Placemark(coords, { balloonContent: `<b>${data.name}</b>` });
    myMap.geoObjects.removeAll();
    myMap.geoObjects.add(placemark);
    myMap.setCenter(coords, 15);
}

init();
</script>

</body>
</html>
